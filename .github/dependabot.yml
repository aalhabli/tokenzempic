version: 2

# Three pull requests a week at most: one npm safe bump, one npm major bump,
# one for the actions. A security update arrives on its own, outside these
# groups and outside the limit. Do not ignore a major version here. An ignore
# rule also suppresses the security update that needs that major version.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
      npm-major:
        patterns: ['*']
        update-types: [major]
    commit-message:
      prefix: 'update'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'update'
