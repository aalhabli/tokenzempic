name: Secret scan

# GitHub secret scanning catches the tokens of the providers that it knows.
# This job catches the rest: the Salesforce auth URLs, the org session IDs,
# and the LLM keys that this tool handles.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Keep the released filename. checksums.txt refers to it by that name,
          # and --ignore-missing verifies nothing if the name does not match.
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${file}" -o "$file"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          sha256sum --ignore-missing --check checksums.txt
          tar -xzf "$file" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "$file" checksums.txt

      - name: Scan the history
        run: gitleaks git . --redact --no-banner --verbose
